name: CI/CD Pipeline (v2.4-Enterprise)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-test-build:
    name: Build, Static Validation & Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Static Syntax & Compilation Validation
        run: |
          python -m py_compile main.py core/*.py pipelines/*.py tests/*.py

      - name: Run Unit Tests
        env:
          GEMINI_API_KEY: "ci_dummy_gemini_key"
          OPENAI_API_KEY: "ci_dummy_openai_key"
          GROQ_API_KEY: "ci_dummy_groq_key"
          DEEPSEEK_API_KEY: "ci_dummy_deepseek_key"
        run: |
          python -m unittest tests/test_llm_router.py -v

      - name: Container Dry-Run Docker Build
        run: |
          docker build -t studio:ci .
