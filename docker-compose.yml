version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: document_intelligence_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - streamlit-app
    networks:
      - studio-network

  streamlit-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: document_intelligence_studio
    restart: unless-stopped
    expose:
      - "8501"
    ports:
      - "8501:8501"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://host.docker.internal:11434
    env_file:
      - .env
    volumes:
      - ./.streamlit:/app/.streamlit:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - studio-network

networks:
  studio-network:
    driver: bridge
